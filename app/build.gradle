plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.colorpatterngenerator'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.colorpatterngenerator"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    
    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "colorpatterngenerator_pg.apk"
        }

        def variantName = variant.name
        def variantTaskName = variantName.capitalize()
        def manualOutputDir = layout.buildDirectory.dir("outputs/apk/${variantName}/manual")
        def copyManualTask = tasks.register("copyManual${variantTaskName}", Copy) {
            description = "Copy user manual and protocol documents next to the ${variantName} APK."
            group = "build"

            from(rootProject.projectDir) {
                include "PROTOCOL.md"
                include "protocol.md"
                include "BUILD.md"
                include "DEV_DIARY.md"
                include "*MANUAL.md"
                include "*Manual.md"
                include "*manual.md"
                include "*MANUAL.pdf"
                include "*Manual.pdf"
                include "*manual.pdf"
                include "*MANUAL.docx"
                include "*Manual.docx"
                include "*manual.docx"
                include "*PROTOCOL.md"
                include "*Protocol.md"
                include "*protocol.md"
                include "*PROTOCOL.pdf"
                include "*Protocol.pdf"
                include "*protocol.pdf"
            }
            into(manualOutputDir)
            includeEmptyDirs = false
            exclude { details ->
                details.file.isFile() && details.file.length() == 0
            }
            doFirst {
                delete(manualOutputDir)
            }
        }

        tasks.named("assemble${variantTaskName}").configure {
            finalizedBy(copyManualTask)
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    testImplementation 'junit:junit:4.13.2'
}
